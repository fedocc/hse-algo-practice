<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Algo Practice — Dia</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">⌘</span><div><strong>Algo Practice</strong><p>Связь с Dia</p></div><span id="indicator" aria-label="Состояние связи"></span></header>
  <p id="status" role="status" aria-live="polite">Проверяю подключение…</p>
  <div class="actions"><button id="connect" class="primary">Подключить</button><button id="open">Открыть тренажёр</button></div>
  <label class="check"><input type="checkbox" id="dry-run" checked><span>Только вставить код<br><small>Не нажимать кнопку отправки</small></span></label>
  <section><h2>Загрузить материалы</h2><button id="import-courses">Все домашки двух курсов</button><button id="import-leetcode">Задачи LeetCode из таблицы</button></section>
  <button id="focus-import" style="margin-top:12px;width:100%">Открыть страницу импорта</button>
  <button id="inspect-form" style="margin-top:8px;width:100%">Диагностика формы задачи</button>
  <details><summary>Проверить полноту условия</summary><label for="statement-url">Адрес задачи (необязательно)</label><input id="statement-url" type="url" placeholder="https://official.contest.yandex.ru/contest/83810/problems/C/" style="width:100%;margin:8px 0"><button id="inspect-statement">Диагностика условия</button></details>
  <p id="error" role="alert"></p>
  <details><summary>Состояние импорта</summary><pre id="debug"></pre><button id="resume">Продолжить сейчас</button></details>
  <details id="inspection-panel"><summary>Элементы формы</summary><pre id="inspection"></pre></details>
  <footer>Использует открытый аккаунт. Материалы сохраняются только на этом Mac.</footer>
  <script src="popup.js"></script>
</body></html>
